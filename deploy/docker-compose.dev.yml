# Только для разработки на своём компьютере: открывает порты базы и сервера наружу контейнеров.
# Запуск:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  postgres:
    # 15432, а не 5432: на компьютере разработчика часто уже занят стандартный порт PostgreSQL
    ports: ["127.0.0.1:15432:5432"]
  server:
    ports: ["127.0.0.1:5080:5080", "127.0.0.1:5081:5081"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # в журнал попадает текст необработанных ошибок
