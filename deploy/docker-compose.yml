# NEXO: инфраструктура (этап Э1). Сервис приложения и Caddy добавляются в ветке с сервером.
# Запуск:  cp .env.example .env  ->  заполнить  ->  docker compose up -d --build
name: nexo

services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Параметры WAL-G (резервные копии в S3-совместимое хранилище, данные шифруются libsodium)
      WALE_S3_PREFIX: ${WALG_S3_PREFIX}
      AWS_ENDPOINT: ${WALG_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_KEY}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ${WALG_S3_REGION:-us-east-1}
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=300        # RPO не более 5 минут
      - -c
      - max_connections=200
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # схема создаётся только при первом запуске пустого тома
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"       # консоль только с этого компьютера
    networks: [internal]

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo "жду MinIO"; sleep 2; done &&
        mc mb --ignore-existing local/nexo-media &&
        mc mb --ignore-existing local/nexo-backups &&
        echo "бакеты созданы"
    networks: [internal]
    restart: "no"

  backup:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    user: postgres
    entrypoint: ["/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      WALE_S3_PREFIX: ${WALG_S3_PREFIX}
      AWS_ENDPOINT: ${WALG_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_KEY}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ${WALG_S3_REGION:-us-east-1}
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      AGE_RECIPIENT: ${AGE_RECIPIENT}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RETAIN_FULL: ${BACKUP_RETAIN_FULL:-30}
      LOGICAL_RETAIN_DAYS: ${LOGICAL_RETAIN_DAYS:-30}
      OFFSITE_ENABLED: ${OFFSITE_ENABLED:-false}
      OFFSITE_PATH: ${OFFSITE_PATH:-nexo-offsite/logical}
      # внешнее хранилище для логических копий (rclone, S3-совместимое), настраивается в .env
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_KEY:-}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro   # WAL-G читает файлы кластера при полной копии
      - backups:/backups
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  miniodata:
  backups:
