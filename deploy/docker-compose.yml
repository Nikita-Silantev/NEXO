# NEXO: инфраструктура и сервер (этап Э1).
# Запуск:  cp .env.example .env  ->  заполнить  ->  docker compose up -d --build
name: nexo

services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Параметры WAL-G (резервные копии в S3-совместимое хранилище, данные шифруются libsodium)
      WALE_S3_PREFIX: ${WALG_S3_PREFIX}
      AWS_ENDPOINT: ${WALG_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_KEY}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ${WALG_S3_REGION:-us-east-1}
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=300        # RPO не более 5 минут
      - -c
      - max_connections=200
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # схема создаётся только при первом запуске пустого тома
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Образы minio/minio и minio/mc удалены с Docker Hub (осень 2026), поэтому используется совместимый форк pgsty/silo
  # (те же переменные MINIO_* и команда server). Версия закреплена; обновлять осознанно, проверяя резервные копии.
  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"       # консоль только с этого компьютера
    networks: [internal]

  # Создание хранилищ (бакетов). Образ pgsty/mc запускает mc напрямую, оболочки не требуется;
  # пока MinIO не поднялся, команда завершается с ошибкой и Docker перезапускает её.
  minio-init-media:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on: [minio]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/nexo-media"]
    restart: on-failure
    networks: [internal]

  minio-init-backups:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on: [minio]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/nexo-backups"]
    restart: on-failure
    networks: [internal]

  backup:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init-media:
        condition: service_completed_successfully
      minio-init-backups:
        condition: service_completed_successfully
    user: postgres
    entrypoint: ["/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      WALE_S3_PREFIX: ${WALG_S3_PREFIX}
      AWS_ENDPOINT: ${WALG_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${WALG_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${WALG_S3_SECRET_KEY}
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: ${WALG_S3_REGION:-us-east-1}
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY}
      WALG_LIBSODIUM_KEY_TRANSFORM: hex
      AGE_RECIPIENT: ${AGE_RECIPIENT}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RETAIN_FULL: ${BACKUP_RETAIN_FULL:-30}
      LOGICAL_RETAIN_DAYS: ${LOGICAL_RETAIN_DAYS:-30}
      OFFSITE_ENABLED: ${OFFSITE_ENABLED:-false}
      OFFSITE_PATH: ${OFFSITE_PATH:-nexo-offsite/logical}
      # внешнее хранилище для логических копий (rclone, S3-совместимое), настраивается в .env
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_KEY:-}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro   # WAL-G читает файлы кластера при полной копии
      - backups:/backups
    networks: [internal]

  server:
    build:
      context: ..
      dockerfile: src/Nexo.Server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Nexo__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Search Path=nexo,public;Maximum Pool Size=60"
      Nexo__KekBase64: ${NEXO_KEK_BASE64}
      Nexo__FakeKdfSecretBase64: ${NEXO_FAKE_KDF_SECRET_BASE64}
      Nexo__SigningKeyFile: /data/signing-key.b64
    volumes:
      - serverdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    environment:
      NEXO_DOMAIN: ${NEXO_DOMAIN:-localhost}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  miniodata:
  backups:
  serverdata:
  caddydata:
