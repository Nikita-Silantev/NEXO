// Постраничный запрос с непрозрачным курсором.
message PageRequest {
  int32 limit = 1;                            // 1..100, по умолчанию 50
  string cursor = 2;                          // значение next_cursor предыдущего ответа
}

message PageInfo {
  string next_cursor = 1;                     // пусто, если страниц больше нет
  bool has_more = 2;
}

// Фрагмент форматирования текста сообщения.
message TextEntity {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_BOLD = 1;
    KIND_ITALIC = 2;
    KIND_UNDERLINE = 3;
    KIND_STRIKE = 4;
    KIND_CODE = 5;
    KIND_PRE = 6;
    KIND_LINK = 7;
    KIND_MENTION = 8;                         // упоминание пользователя (user_id)
    KIND_SPOILER = 9;
  }
  Kind kind = 1;
  int32 offset = 2;                           // смещение в UTF-16 кодовых единицах
  int32 length = 3;
  string url = 4;                             // для KIND_LINK
  string user_id = 5;                         // для KIND_MENTION
}

// Информация о клиентском устройстве, передаваемая при входе и регистрации.
message DeviceInfo {
  string name = 1;                            // например «MacBook Никиты»
  DevicePlatform platform = 2;
  string app_version = 3;
  string os_version = 4;
  bytes device_pubkey = 5;                    // Ed25519, 32 байта
}

// Пара токенов доступа.
message TokenPair {
  string access_token = 1;                    // JWT (EdDSA), срок жизни 10 минут
  google.protobuf.Timestamp access_expires_at = 2;
  string refresh_token = 3;                   // непрозрачный, 256 бит, одноразовый
  google.protobuf.Timestamp refresh_expires_at = 4;
  string device_id = 5;
  string session_id = 6;
}
