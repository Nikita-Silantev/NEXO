// RU.00000000.00001-01 13 01. Протокол взаимодействия NEXO. Общие типы.
syntax = "proto3";

package nexo.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Nexo.Protocol.V1";

// ---------------------------------------------------------------------------
// Соглашения (обязательны для всех файлов протокола):
//  1. Идентификаторы (UUID) передаются строкой в каноническом виде (RFC 9562, UUIDv7).
//  2. Время передаётся google.protobuf.Timestamp в UTC.
//  3. Поле «update_seq» в Update — порядковый номер в журнале обновлений
//     пользователя; 0 означает эфемерное (недолговечное) обновление.
//  4. Номера полей не переиспользуются; удалённые поля помечаются reserved.
// ---------------------------------------------------------------------------

// Код причины ошибки. Передаётся в ErrorDetail.reason.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_CREDENTIALS = 1;       // неверный логин или пароль
  ERROR_REASON_ACCOUNT_LOCKED = 2;            // вход временно заблокирован
  ERROR_REASON_ACCOUNT_SUSPENDED = 3;         // учётная запись приостановлена
  ERROR_REASON_SECOND_FACTOR_REQUIRED = 4;    // требуется второй фактор
  ERROR_REASON_SECOND_FACTOR_INVALID = 5;     // неверный код второго фактора
  ERROR_REASON_TOKEN_EXPIRED = 6;             // срок действия access-токена истёк
  ERROR_REASON_TOKEN_REVOKED = 7;             // сессия отозвана
  ERROR_REASON_REFRESH_REUSE_DETECTED = 8;    // повторное использование refresh-токена
  ERROR_REASON_USERNAME_TAKEN = 9;            // ник занят
  ERROR_REASON_USERNAME_INVALID = 10;         // ник не соответствует правилам
  ERROR_REASON_PASSWORD_WEAK = 11;            // пароль не соответствует политике
  ERROR_REASON_POW_REQUIRED = 12;             // нужно решить вычислительную задачу
  ERROR_REASON_POW_INVALID = 13;              // решение задачи неверно или устарело
  ERROR_REASON_RATE_LIMITED = 14;             // превышен лимит запросов
  ERROR_REASON_DOCUMENTS_NOT_ACCEPTED = 15;   // не приняты обязательные юридические документы
  ERROR_REASON_NOT_FOUND = 16;                // объект не найден или недоступен
  ERROR_REASON_PERMISSION_DENIED = 17;        // недостаточно прав
  ERROR_REASON_BLOCKED_BY_PEER = 18;          // собеседник ограничил отправку
  ERROR_REASON_PRIVACY_RESTRICTED = 19;       // действие запрещено настройками приватности
  ERROR_REASON_CHAT_FULL = 20;                // достигнут лимит участников
  ERROR_REASON_MESSAGE_TOO_LONG = 21;         // сообщение длиннее допустимого
  ERROR_REASON_EDIT_WINDOW_EXPIRED = 22;      // срок редактирования истёк
  ERROR_REASON_SLOW_MODE = 23;                // действует медленный режим
  ERROR_REASON_STATUS_TEXT_REJECTED = 24;     // текст статуса не прошёл фильтр
  ERROR_REASON_FILE_TOO_LARGE = 25;           // файл превышает максимальный размер
  ERROR_REASON_QUOTA_EXCEEDED = 26;           // исчерпана квота хранилища
  ERROR_REASON_UPLOAD_EXPIRED = 27;           // сессия загрузки истекла
  ERROR_REASON_CHECKSUM_MISMATCH = 28;        // контрольная сумма не совпала
  ERROR_REASON_FILE_RESTORING = 29;           // файл восстанавливается из холодного хранилища
  ERROR_REASON_PREKEYS_EXHAUSTED = 30;        // одноразовые предключи устройства закончились
  ERROR_REASON_DEVICE_NOT_FOUND = 31;         // устройство не найдено или отозвано
  ERROR_REASON_CALL_BUSY = 32;                // абонент занят
  ERROR_REASON_CALL_ENDED = 33;               // звонок уже завершён
  ERROR_REASON_VERSION_CONFLICT = 34;         // конфликт версий (оптимистическая блокировка)
  ERROR_REASON_CLIENT_TOO_OLD = 35;           // версия клиента больше не поддерживается
  ERROR_REASON_RESYNC_REQUIRED = 36;          // нужна полная повторная синхронизация
}

// Деталь ошибки: передаётся в бинарном трейлере grpc-status-details-bin.
message ErrorDetail {
  ErrorReason reason = 1;
  map<string, string> metadata = 2;           // параметры для локализации (лимиты, сроки)
  int32 retry_after_seconds = 3;              // через сколько секунд повторить (0 — не задано)
}

